[package]
name = "vtr-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Stable C ABI for the VTR trace library (libvtr)"

[lib]
name = "vtr"
crate-type = ["cdylib", "staticlib"]
doc = false

[features]
private-heap = ["dep:mimalloc"]

[dependencies]
vtr.workspace = true
vtr-guard = { version = "0.1.0", path = "../vtr-guard" }
mimalloc = { version = "0.1", default-features = false, optional = true }
libc = "0.2"

[dev-dependencies]
cc = "1"
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
