[workspace]
resolver = "2"
exclude = ["ext/elkrs"]
members = [
    "crates/vtr",
    "crates/vtr-capi",
    "crates/vtr-cli",
    "crates/vtr-bench",
    "crates/vtr-vdb",
    "crates/volna-core",
    "crates/volna",
]
# Keep the default core build independent of the viewer's platform SDK.
default-members = [
    "crates/vtr",
    "crates/vtr-capi",
    "crates/vtr-cli",
    "crates/vtr-bench",
    "crates/vtr-vdb",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ripopov/vtr"
rust-version = "1.80"

[profile.release]
debug = 1
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"


# Preserve the viewer's build settings without changing core benchmark profiles.
[profile.viewer]
inherits = "release"
debug = 0
lto = "thin"
codegen-units = 4
