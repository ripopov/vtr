[workspace]
resolver = "2"
exclude = ["ext/elkrs"]
members = [
    "core/vtr",
    "core/vtr-capi",
    "tools/vtr-cli",
    "tools/volna-server",
    "bench/vtr-bench",
    "core/vtr-vdb",
    "volna/volna-core",
    "volna/volna",
    "volna/volna-egui",
]
# Keep the default core build independent of the viewer's platform SDK.
default-members = [
    "core/vtr",
    "core/vtr-capi",
    "tools/vtr-cli",
    "bench/vtr-bench",
    "core/vtr-vdb",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ripopov/vtr"
rust-version = "1.80"

[profile.release]
debug = 1
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"

# The egui frontend's headless rasterizer is far too slow unoptimized; its
# tests build the crate with optimizations even in the dev/test profiles.
[profile.dev.package.volna-egui]
opt-level = 2

# Preserve the viewer's build settings without changing core benchmark profiles.
[profile.viewer]
inherits = "release"
debug = 0
lto = "thin"
codegen-units = 4
