name: Volna agent control
on:
  push:
    paths:
      - 'docs/volna-mcp.html'
      - 'docs/tests/volna-mcp.test.mjs'
      - 'volna/volna/tools/browser-test.mjs'
      - '.github/workflows/volna-mcp.yml'
  pull_request:
    paths:
      - 'docs/volna-mcp.html'
      - 'docs/tests/volna-mcp.test.mjs'
      - 'volna/volna/tools/browser-test.mjs'
      - '.github/workflows/volna-mcp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VOLNA_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify headless browser prerequisite
        run: google-chrome --version
      - name: Test the design demo
        run: node --test --test-concurrency=1 docs/tests/volna-mcp.test.mjs
