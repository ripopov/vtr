name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  vtr-cpp-install:
    name: Native C++ and C integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-29
      - run: sudo apt-get update && sudo apt-get install -y cmake liblz4-dev libzstd-dev zlib1g-dev
      - run: cmake -S vtr-cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/cpp --parallel 2
      - run: ctest --test-dir build/cpp --output-on-failure
      - name: Install and link an external C consumer
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/vtr-cpp"
          ./vtr-cpp/install.sh --target-dir "$out/target" --prefix "$out/prefix"
          ./vtr-cpp/install.sh --target-dir "$out/target" --prefix "$out/prefix"
          cp vtr-cpp/tests/c_smoke.c "$out/c_smoke.c"
          export PKG_CONFIG_PATH="$out/prefix/lib/pkgconfig"
          cc -std=c99 -Wall -Wextra -Werror -O1 \
            $(pkg-config --cflags vtr) "$out/c_smoke.c" \
            $(pkg-config --static --libs vtr) -o "$out/c_smoke"
          "$out/c_smoke" "$out/trace.vtr"
          ./vtr-cpp/install.sh --target-dir "$out/target-debug" --prefix "$out/prefix-debug" --debug
          export PKG_CONFIG_PATH="$out/prefix-debug/lib/pkgconfig"
          cc -std=c99 -Wall -Wextra -Werror -O1 \
            $(pkg-config --cflags vtr) "$out/c_smoke.c" \
            $(pkg-config --static --libs vtr) -o "$out/c_smoke_debug"
          "$out/c_smoke_debug" "$out/trace-debug.vtr"
          "$out/c_smoke" "$out/trace-again.vtr"
          test -z "$(git status --porcelain)"

  test:
    name: Test (${{ matrix.os }}, nightly)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-29
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo check --workspace --all-targets --locked
      - name: Exercise examples
        shell: bash
        run: |
          cargo run -p vtr --locked --example waveform -- "$RUNNER_TEMP/waveform.vtr"
          cargo run -p vtr --locked --example logging -- "$RUNNER_TEMP/logging.vtr"
          cargo run -p vtr-cli --locked -- convert vtr-convert/tests/fixtures/pipeline.kanata "$RUNNER_TEMP/pipeline.vtr"
          cargo run -p vtr-cli --locked -- clocks "$RUNNER_TEMP/pipeline.vtr"
          cargo run -p vtr-cli --locked -- convert vtr-convert/tests/fixtures/waves.vcd "$RUNNER_TEMP/imported.vtr"
          cargo run -p vtr-cli --locked -- value "$RUNNER_TEMP/imported.vtr" 'top.bus [3:0]' 5

  quality:
    name: Format, lint, docs, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-29
          components: rustfmt, clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo package -p vtr --locked

  vtr-msrv:
    name: VTR minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-29
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Test the standalone VTR package on its minimum Rust version
        shell: bash
        run: |
          set -euo pipefail
          cargo package -p vtr --locked --no-verify
          package=$(cargo pkgid -p vtr)
          version=${package##*#}
          version=${version##*@}
          mkdir -p "$RUNNER_TEMP/vtr-msrv"
          tar -xzf "target/package/vtr-$version.crate" -C "$RUNNER_TEMP/vtr-msrv"
          cd "$RUNNER_TEMP/vtr-msrv/vtr-$version"
          cargo +1.97.1 test --locked

  dependencies:
    name: Dependency hygiene and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-29
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-machete --version 0.9.2
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo machete
      - run: cargo deny --workspace --locked check

  miri:
    name: Miri core memory safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-29
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly-2026-09-29 miri setup
      # These tests exercise Rust-owned memory without invoking native codecs or mmap.
      - run: cargo +nightly-2026-09-29 miri test -p vtr --lib --locked strings::tests
      - run: cargo +nightly-2026-09-29 miri test -p vtr --lib --locked varint::tests
      - run: cargo +nightly-2026-09-29 miri test -p vtr --lib --locked allocator_
