name: XiangShan ZhuJiang dual-core diagram
on:
  push:
    paths:
      - 'docs/xiangshan-zhujiang-dualcore.html'
      - 'docs/tests/xiangshan-zhujiang-dualcore.test.mjs'
      - 'volna/volna/tools/browser-test.mjs'
      - '.github/workflows/xiangshan-zhujiang-dualcore.yml'
  pull_request:
    paths:
      - 'docs/xiangshan-zhujiang-dualcore.html'
      - 'docs/tests/xiangshan-zhujiang-dualcore.test.mjs'
      - 'volna/volna/tools/browser-test.mjs'
      - '.github/workflows/xiangshan-zhujiang-dualcore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagram:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The source test re-reads and hashes every cited line range at the pinned
      # commits, so it needs XiangShan with its XSCache, ZhuJiang and difftest sources.
      - name: Check out the pinned XiangShan sources
        uses: actions/checkout@v4
        with:
          repository: ripopov/XiangShan
          ref: aa6b52033add528a504bdb2c2b726100d89f070a
          path: ext/XiangShan
      - name: Check out the cited nested sources
        run: |
          git -C ext/XiangShan submodule update --init --depth 1 XSCache difftest
          git -C ext/XiangShan/XSCache submodule update --init --depth 1 ZhuJiang
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Verify the headless browser prerequisite
        env:
          VOLNA_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: '"$VOLNA_CHROME" --version'
      - name: Test the diagram
        env:
          VOLNA_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node --test --test-concurrency=1 docs/tests/xiangshan-zhujiang-dualcore.test.mjs
