name: VTR core tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # vtr-vdb has an optional path dependency on elkrs; Cargo reads its
      # manifest to resolve the workspace even when it is not built. The
      # verilator_logs test reads Verilator-written fixtures from the Surfer fork.
      - name: Check out the elkrs and Surfer submodules
        run: git submodule update --init --depth 1 ext/elkrs ext/surfer
      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Verify the C compiler used by the C smoke test
        run: cc --version
      - name: Test the Rust core, the C API and the C smoke test
        run: cargo test --locked -p vtr -p vtr-capi -- --skip crash_matrix
  crash-matrix:
    # Every way a simulation can end, run in child processes against libvtr.a
    # (core/vtr-capi/tests/crash.rs, docs/crash-safe-vtr.html).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out the elkrs submodule
        run: git submodule update --init --depth 1 ext/elkrs
      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Verify the C++ compiler used by the crash harness
        run: c++ --version
      - name: Run the crash matrix
        run: cargo test --locked -p vtr-capi --test crash -- --nocapture
