<!-- @dsCard group="Spacing" viewport="700x160" name="Motion" subtitle="120 / 150 / 350ms, ease-out. Colour and opacity only; zero under reduced motion" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 22px;background:var(--bg);color:var(--text-1)}.l{font:11px/1.3 var(--font-mono);color:var(--text-3)}.row{display:flex;gap:0}.sw{flex:1;height:44px}.lab{display:flex;justify-content:space-between;margin:6px 0 14px}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px"><div style="border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--surface-card)"><div style="font:600 22px var(--font-mono)">120ms</div><div class="l">--dur-fast</div><div style="font-size:13px;color:var(--text-2);margin-top:6px">link colour, tab</div></div><div style="border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--surface-card)"><div style="font:600 22px var(--font-mono)">150ms</div><div class="l">--dur-base</div><div style="font-size:13px;color:var(--text-2);margin-top:6px">button bg, border</div></div><div style="border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--surface-card)"><div style="font:600 22px var(--font-mono)">350ms</div><div class="l">--dur-slow</div><div style="font-size:13px;color:var(--text-2);margin-top:6px">overlay fade, bar fill</div></div></div><div class="l" style="margin-top:12px">--ease-out cubic-bezier(.2,0,0,1) · no bounce, no parallax, no scroll-triggered reveals</div></body></html>
