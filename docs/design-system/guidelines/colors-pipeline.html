<!-- @dsCard group="Colors" viewport="700x200" name="Pipeline stages & markers" subtitle="Stage ladder hsl(250→0, 52%, 58%) with #101820 text · six marker colours" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 22px;background:var(--bg);color:var(--text-1)}.l{font:11px/1.3 var(--font-mono);color:var(--text-3)}.row{display:flex;gap:0}.sw{flex:1;height:44px}.lab{display:flex;justify-content:space-between;margin:6px 0 14px}</style></head><body>
<div style="display:flex;gap:3px;margin-bottom:6px"><div style="flex:1;height:30px;display:grid;place-items:center;background:var(--stage-1);border:1px solid var(--stage-edge-1);color:var(--stage-text);font:12px var(--font-mono);border-radius:3px">F</div><div style="flex:1;height:30px;display:grid;place-items:center;background:var(--stage-2);border:1px solid var(--stage-edge-2);color:var(--stage-text);font:12px var(--font-mono);border-radius:3px">D</div><div style="flex:1;height:30px;display:grid;place-items:center;background:var(--stage-3);border:1px solid var(--stage-edge-3);color:var(--stage-text);font:12px var(--font-mono);border-radius:3px">R</div><div style="flex:1;height:30px;display:grid;place-items:center;background:var(--stage-4);border:1px solid var(--stage-edge-4);color:var(--stage-text);font:12px var(--font-mono);border-radius:3px">X</div><div style="flex:1;height:30px;display:grid;place-items:center;background:var(--stage-5);border:1px solid var(--stage-edge-5);color:var(--stage-text);font:12px var(--font-mono);border-radius:3px">M</div><div style="flex:1;height:30px;display:grid;place-items:center;background:var(--stage-6);border:1px solid var(--stage-edge-6);color:var(--stage-text);font:12px var(--font-mono);border-radius:3px">W</div><div style="flex:1;height:30px;display:grid;place-items:center;background:var(--stage-fallback);color:var(--stage-text);font:12px var(--font-mono);border-radius:3px">?</div></div><div class="l" style="margin-bottom:18px">--stage-1 … --stage-6 · --stage-fallback · same in both themes</div>
 <div style="display:flex;gap:18px"><div data-theme="dark" style="flex:1;background:var(--wave-bg);padding:10px;display:flex;gap:6px"><span style="flex:1;background:var(--marker-1);color:#282c33;font:11px var(--font-mono);text-align:center;padding:3px 0;border-radius:3px">M1</span><span style="flex:1;background:var(--marker-2);color:#282c33;font:11px var(--font-mono);text-align:center;padding:3px 0;border-radius:3px">M2</span><span style="flex:1;background:var(--marker-3);color:#282c33;font:11px var(--font-mono);text-align:center;padding:3px 0;border-radius:3px">M3</span><span style="flex:1;background:var(--marker-4);color:#282c33;font:11px var(--font-mono);text-align:center;padding:3px 0;border-radius:3px">M4</span><span style="flex:1;background:var(--marker-5);color:#282c33;font:11px var(--font-mono);text-align:center;padding:3px 0;border-radius:3px">M5</span><span style="flex:1;background:var(--marker-6);color:#282c33;font:11px var(--font-mono);text-align:center;padding:3px 0;border-radius:3px">M6</span></div><div data-theme="light" style="flex:1;background:var(--wave-bg);padding:10px;display:flex;gap:6px"><span style="flex:1;background:var(--marker-1);color:#fff;font:11px var(--font-mono);text-align:center;padding:3px 0;border-radius:3px">M1</span><span style="flex:1;background:var(--marker-2);color:#fff;font:11px var(--font-mono);text-align:center;padding:3px 0;border-radius:3px">M2</span><span style="flex:1;background:var(--marker-3);color:#fff;font:11px var(--font-mono);text-align:center;padding:3px 0;border-radius:3px">M3</span><span style="flex:1;background:var(--marker-4);color:#fff;font:11px var(--font-mono);text-align:center;padding:3px 0;border-radius:3px">M4</span><span style="flex:1;background:var(--marker-5);color:#fff;font:11px var(--font-mono);text-align:center;padding:3px 0;border-radius:3px">M5</span><span style="flex:1;background:var(--marker-6);color:#fff;font:11px var(--font-mono);text-align:center;padding:3px 0;border-radius:3px">M6</span></div></div></body></html>
