<!-- @dsCard group="Colors" viewport="700x200" name="Semantic states" subtitle="One Dark states in dark, GitHub-light states in light; info = accent" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 22px;background:var(--bg);color:var(--text-1)}.l{font:11px/1.3 var(--font-mono);color:var(--text-3)}.row{display:flex;gap:0}.sw{flex:1;height:44px}.lab{display:flex;justify-content:space-between;margin:6px 0 14px}body{padding:0}</style></head><body>
<div style="display:flex"><div data-theme="dark" style="background:var(--bg);padding:14px;flex:1"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="width:28px;height:28px;background:var(--success);border-radius:4px"></span><span style="flex:1;padding:5px 10px;background:var(--success-soft);color:var(--success);font:12px var(--font-mono);border:1px solid color-mix(in srgb,var(--success) 40%,transparent);border-radius:4px">--success on --success-soft</span></div><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="width:28px;height:28px;background:var(--warning);border-radius:4px"></span><span style="flex:1;padding:5px 10px;background:var(--warning-soft);color:var(--warning);font:12px var(--font-mono);border:1px solid color-mix(in srgb,var(--warning) 40%,transparent);border-radius:4px">--warning on --warning-soft</span></div><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="width:28px;height:28px;background:var(--danger);border-radius:4px"></span><span style="flex:1;padding:5px 10px;background:var(--danger-soft);color:var(--danger);font:12px var(--font-mono);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);border-radius:4px">--danger on --danger-soft</span></div><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="width:28px;height:28px;background:var(--info);border-radius:4px"></span><span style="flex:1;padding:5px 10px;background:var(--info-soft);color:var(--info);font:12px var(--font-mono);border:1px solid color-mix(in srgb,var(--info) 40%,transparent);border-radius:4px">--info on --info-soft</span></div><div class="l">dark</div></div><div data-theme="light" style="background:var(--bg);padding:14px;flex:1"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="width:28px;height:28px;background:var(--success);border-radius:4px"></span><span style="flex:1;padding:5px 10px;background:var(--success-soft);color:var(--success);font:12px var(--font-mono);border:1px solid color-mix(in srgb,var(--success) 40%,transparent);border-radius:4px">--success on --success-soft</span></div><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="width:28px;height:28px;background:var(--warning);border-radius:4px"></span><span style="flex:1;padding:5px 10px;background:var(--warning-soft);color:var(--warning);font:12px var(--font-mono);border:1px solid color-mix(in srgb,var(--warning) 40%,transparent);border-radius:4px">--warning on --warning-soft</span></div><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="width:28px;height:28px;background:var(--danger);border-radius:4px"></span><span style="flex:1;padding:5px 10px;background:var(--danger-soft);color:var(--danger);font:12px var(--font-mono);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);border-radius:4px">--danger on --danger-soft</span></div><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="width:28px;height:28px;background:var(--info);border-radius:4px"></span><span style="flex:1;padding:5px 10px;background:var(--info-soft);color:var(--info);font:12px var(--font-mono);border:1px solid color-mix(in srgb,var(--info) 40%,transparent);border-radius:4px">--info on --info-soft</span></div><div class="l">light</div></div></div></body></html>
