<!-- @dsCard group="Colors" viewport="700x260" name="Surfaces & text" subtitle="Semantic roles: bg → raised → card → hover → selected; text-1/2/3 all ≥4.5:1" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 22px;background:var(--bg);color:var(--text-1)}.l{font:11px/1.3 var(--font-mono);color:var(--text-3)}.row{display:flex;gap:0}.sw{flex:1;height:44px}.lab{display:flex;justify-content:space-between;margin:6px 0 14px}body{padding:0}</style></head><body>
<div style="display:flex"><div data-theme="dark" style="background:var(--bg);padding:14px;flex:1;min-width:0"><div class="l" style="margin-bottom:8px">dark</div><div style="display:flex;gap:4px;margin-bottom:10px"><div style="flex:1;height:34px;background:var(--bg);border:1px solid var(--border)" title="--bg"></div><div style="flex:1;height:34px;background:var(--bg-raised);border:1px solid var(--border)" title="--bg-raised"></div><div style="flex:1;height:34px;background:var(--surface-card);border:1px solid var(--border)" title="--surface-card"></div><div style="flex:1;height:34px;background:var(--surface-hover);border:1px solid var(--border)" title="--surface-hover"></div><div style="flex:1;height:34px;background:var(--surface-selected);border:1px solid var(--border)" title="--surface-selected"></div><div style="flex:1;height:34px;background:var(--border);border:1px solid var(--border)" title="--border"></div><div style="flex:1;height:34px;background:var(--border-strong);border:1px solid var(--border)" title="--border-strong"></div></div><div style="color:var(--text-1);font-size:13px;line-height:1.6">text-1 <span class="l">--text-1</span></div><div style="color:var(--text-2);font-size:13px;line-height:1.6">text-2 <span class="l">--text-2</span></div><div style="color:var(--text-3);font-size:13px;line-height:1.6">text-3 <span class="l">--text-3</span></div><div style="color:var(--accent-text);font-size:13px;line-height:1.6">accent-text <span class="l">--accent-text</span></div><div style="display:flex;gap:6px;margin-top:8px"><span style="background:var(--accent);color:var(--on-accent);font:12px var(--font-mono);padding:3px 8px;border-radius:var(--radius-sm)">accent</span><span style="background:var(--accent-soft);color:var(--accent-text);font:12px var(--font-mono);padding:3px 8px;border-radius:var(--radius-sm)">soft</span></div></div><div data-theme="light" style="background:var(--bg);padding:14px;flex:1;min-width:0"><div class="l" style="margin-bottom:8px">light</div><div style="display:flex;gap:4px;margin-bottom:10px"><div style="flex:1;height:34px;background:var(--bg);border:1px solid var(--border)" title="--bg"></div><div style="flex:1;height:34px;background:var(--bg-raised);border:1px solid var(--border)" title="--bg-raised"></div><div style="flex:1;height:34px;background:var(--surface-card);border:1px solid var(--border)" title="--surface-card"></div><div style="flex:1;height:34px;background:var(--surface-hover);border:1px solid var(--border)" title="--surface-hover"></div><div style="flex:1;height:34px;background:var(--surface-selected);border:1px solid var(--border)" title="--surface-selected"></div><div style="flex:1;height:34px;background:var(--border);border:1px solid var(--border)" title="--border"></div><div style="flex:1;height:34px;background:var(--border-strong);border:1px solid var(--border)" title="--border-strong"></div></div><div style="color:var(--text-1);font-size:13px;line-height:1.6">text-1 <span class="l">--text-1</span></div><div style="color:var(--text-2);font-size:13px;line-height:1.6">text-2 <span class="l">--text-2</span></div><div style="color:var(--text-3);font-size:13px;line-height:1.6">text-3 <span class="l">--text-3</span></div><div style="color:var(--accent-text);font-size:13px;line-height:1.6">accent-text <span class="l">--accent-text</span></div><div style="display:flex;gap:6px;margin-top:8px"><span style="background:var(--accent);color:var(--on-accent);font:12px var(--font-mono);padding:3px 8px;border-radius:var(--radius-sm)">accent</span><span style="background:var(--accent-soft);color:var(--accent-text);font:12px var(--font-mono);padding:3px 8px;border-radius:var(--radius-sm)">soft</span></div></div></div></body></html>
