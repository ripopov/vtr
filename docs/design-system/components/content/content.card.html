</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.VolnaDesignSystem_3096af;

const { CodeBlock, Kbd, Callout, Chip } = NS;
ReactDOM.createRoot(root).render(<div>
  <CodeBlock lang="sh" filename="shell" code={"# record VTR straight from Verilator\n$ verilator --binary --trace-vtr top.sv\n$ volna obj_dir/top.vtr"} />
  <div className="row" style={{margin:'14px 0',fontSize:14,color:'var(--text-2)',gap:14}}>
    <span>Fit <Kbd>F</Kbd></span><span>Palette <Kbd keys={['Ctrl','K']}/></span><span>Split <Kbd keys={['Ctrl','\\']}/></span><span>Step edge <Kbd>[</Kbd> <Kbd>]</Kbd></span><span>Marker <Kbd>M</Kbd></span>
  </div>
  <div className="row" style={{marginBottom:6}}><Chip>META</Chip><Chip>HIER</Chip><Chip swatch="var(--wave-signal)">SIGNAL</Chip><Chip swatch="var(--tx-out)">TX</Chip><Chip swatch="var(--wave-dontcare)">LOG</Chip><Chip tone="accent">--trace-vtr</Chip><Chip tone="warning">L2 miss</Chip><Chip tone="danger">flush</Chip></div>
  <Callout title="VDB is separate from VTR.">Colours, stage meaning and source locations live in a VDB beside the trace, never in the trace file.</Callout>
  <Callout tone="warning" title="The WASM build needs WebGPU or WebGL2." />
</div>);
</script></body></html>
