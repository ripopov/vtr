[package]
name = "volna-core"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"
rust-version = "1.96"
description = "Volna viewer core: document, view models, display-list rendering. No GUI toolkit."

[lib]
crate-type = ["rlib"]

[dependencies]
vtr = { path = "../../core/vtr" }
vtr-query = { path = "../../core/vtr-query" }
anyhow = "1"
fst-reader = "0.17"
flate2 = "1"
log = "0.4"
web-time = "1"
url = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
futures-lite = "2"
vtr-query = { path = "../../core/vtr-query", features = ["native-engine"] }
tempfile = "3"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
vtr-query = { path = "../../core/vtr-query", features = ["native-engine"] }
