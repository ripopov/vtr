[package]
name = "volna-trace"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"
rust-version = "1.96"
description = "Standalone immutable trace access and complete-object remote loading"

[lib]
crate-type = ["rlib"]

[dependencies]
vtr = { path = "../../core/vtr" }
# The FST front end of the activity index.
vtr-cli = { path = "../../tools/vtr-cli", default-features = false }
anyhow = "1"
bincode = "=1.3.3"
lz4_flex = { version = "=0.11.6", features = ["frame"] }
fst-reader = "0.17"
flate2 = "1"
serde = { version = "1", features = ["derive"] }

[features]
# Shared procedural histories for headless loader and viewer tests.
testing = []

[dev-dependencies]
serde_json = "1"
volna-trace = { path = ".", features = ["testing"] }
tempfile = "3"
