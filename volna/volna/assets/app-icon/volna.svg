<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Volna</title>
  <desc id="desc">A pearl-white seal resting among tall blue V-shaped waves on a softly shaded slate-to-midnight tile with transparent corners.</desc>
  <defs>
    <linearGradient id="sealShade" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBFCFF"/>
      <stop offset="1" stop-color="#D5E2F2"/>
    </linearGradient>
    <linearGradient id="waveShade" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7088E7"/>
      <stop offset="1" stop-color="#3C62BD"/>
    </linearGradient>
    <linearGradient id="crestShade" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A1E7ED"/>
      <stop offset="1" stop-color="#58B5D9"/>
    </linearGradient>
    <linearGradient id="tileShade" x1="0" y1="0" x2="0.35" y2="1">
      <stop stop-color="#34435F"/>
      <stop offset="1" stop-color="#141F34"/>
    </linearGradient>
  </defs>

  <!-- Canonical app artwork: taller waves, a larger mascot, and an inset soft tile. -->
  <g id="dockInset" transform="translate(62.7 62.7) scale(0.9)">
