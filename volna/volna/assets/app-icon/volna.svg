      <path id="nose" fill="#23314C" d="M813 230C799 231 776 238 766 249C760 255 758 264 766 268L790 275Q801 280 809 272C818 263 820 252 817 244Q821 227 813 230Z"/>
      <path id="smile" fill="#23314C" d="M806 273L810 275L809 293C823 299 832 310 837 326C830 310 819 301 808 297C794 329 773 352 742 370C774 348 792 324 805 294Z"/>
      <g fill="#23314C">
        <ellipse cx="718.5" cy="307" rx="3.5" ry="1.4" transform="rotate(-40 718.5 307)"/>
        <ellipse cx="736" cy="302" rx="3.5" ry="1.7" transform="rotate(-43 736 302)"/>
        <ellipse cx="753" cy="303" rx="3" ry="1.6" transform="rotate(-55 753 303)"/>
        <ellipse cx="715" cy="327" rx="7" ry="1.7" transform="rotate(-41 715 327)"/>
