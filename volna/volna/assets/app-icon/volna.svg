    <path id="crest" transform="matrix(1 0 0 1.20 0 -227.6)" fill="#9ADFE8" d="M746 580C791 540 840 518 881 501C960 469 1037 469 1094 495C1136 517 1163 558 1167 606C1155 554 1117 525 1065 528C1001 527 938 554 881 594C829 630 789 671 741 704Z"/>
    <g id="mascot" transform="matrix(1.06 0 0 1.06 -33.6 -48)">
      <path id="seal" fill="url(#sealShade)" d="M230 683C291 623 320 574 354 497C393 402 449 326 521 277C577 237 638 214 688 216C737 215 755 235 782 234L813 229Q821 226 819 243C843 256 852 277 850 309C850 371 831 417 806 475C791 510 787 532 785 569C782 670 737 759 670 816C642 841 614 859 589 876L353 815Z"/>

