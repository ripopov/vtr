[package]
name = "volna"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"
rust-version = "1.96"
default-run = "volna"
description = "Volna: the official VTR/VDB viewer. GPUI frontend for native, web and VS Code over volna-core"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "volna"
path = "src/main.rs"

[[test]]
name = "viewer"
path = "tests/viewer.rs"
harness = false
required-features = ["visual-test"]

[features]
default = []
# Offscreen Metal rendering for screenshots and frame-time measurement (macOS).
visual-test = ["dep:image", "dep:libtest-mimic"]

[dependencies]
gpui-kit = "=0.6.1"
volna-core = { path = "../volna-core" }
anyhow = "1"
futures = "0.3"
log = "0.4"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
libtest-mimic = { version = "0.8", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
gpui-kit = { version = "=0.6.1", features = ["test-support"] }

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2"
js-sys = "0.3"
