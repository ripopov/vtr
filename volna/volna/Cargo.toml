[package]
name = "volna"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"
rust-version = "1.96"
autoexamples = false
default-run = "volna"
description = "Volna: the official VTR/VDB viewer. GPUI frontend for native, web and VS Code over volna-core"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "volna"
path = "src/main.rs"

[[test]]
name = "viewer"
path = "tests/viewer.rs"
harness = false
required-features = ["visual-test"]

[features]
default = []
# Browser verification of complete transaction loads before a track UI exists.
remote-profile = []
# Offscreen Metal rendering for screenshots and frame-time measurement (macOS).
visual-test = ["dep:libtest-mimic"]

[dependencies]
# `profiler` records whole-window frame histograms for the status bar.
gpui-kit = { version = "=0.7.0", features = ["profiler"] }
volna-core = { path = "../volna-core" }
anyhow = "1"
futures = "0.3"
# The type of GPUI's profiler histograms.
hdrhistogram = { version = "7", default-features = false }
log = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
lsp-types = "0.97"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
env_logger = "0.11"
tempfile = "3"
url = "2"
notify = "7"
image = { version = "0.25", default-features = false, features = ["png"] }
# JSON highlighting in the settings editor; the web build keeps the stub.
gpui-kit = { version = "=0.7.0", features = ["tree-sitter"] }

[target.'cfg(target_os = "macos")'.dependencies]
libtest-mimic = { version = "0.8", optional = true }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
volna-core = { path = "../volna-core", features = ["testing"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
gpui-kit = { version = "=0.7.0", features = ["test-support"] }
# Activity indexes for the scope meter tests.
vtr = { path = "../../core/vtr" }
tempfile = "3"

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2"
js-sys = "0.3"
