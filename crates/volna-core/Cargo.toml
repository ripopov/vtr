[package]
name = "volna-core"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"
rust-version = "1.96"
description = "Volna viewer core: document, view models, display-list rendering. No GUI toolkit."

[lib]
crate-type = ["rlib"]

[dependencies]
vtr = { path = "../vtr" }
anyhow = "1"
fst-reader = "0.17"
flate2 = "1"
log = "0.4"
web-time = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
