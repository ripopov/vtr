[package]
name = "vtr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line tools for VTR traces: inspect, query, convert (FST, VCD, Kanata, OTLP JSON, FTR)"

[lib]
name = "vtr_cli"
path = "src/lib.rs"

[[bin]]
name = "vtr"
path = "src/main.rs"

[[bin]]
name = "vtr2vcd"
path = "src/bin/vtr2vcd.rs"

[dependencies]
vtr = { path = "../vtr" }
fst-reader = "0.17"
wellen = "0.25"
flate2 = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
serde_json = "1"
