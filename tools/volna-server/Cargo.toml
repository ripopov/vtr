[package]
name = "volna-server"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"
rust-version = "1.96"
description = "Headless complete-object trace loader for Volna"

[dependencies]
volna-trace = { path = "../../volna/volna-trace" }
anyhow = "1"
vtr = { path = "../../core/vtr" }
getrandom = "=0.4.3"
gethostname = "=1.1.0"
serde = "1"

[dev-dependencies]
volna-trace = { path = "../../volna/volna-trace", features = ["testing"] }
tempfile = "3"
bincode = "=1.3.3"
serde_json = "1"
