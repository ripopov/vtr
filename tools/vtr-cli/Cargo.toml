[package]
name = "vtr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line tools for VTR traces: inspect, query, convert (FST, VCD, Kanata, OTLP JSON, FTR)"

[lib]
name = "vtr_cli"
path = "src/lib.rs"

[[bin]]
name = "vtr"
path = "src/main.rs"
required-features = ["vcd"]

[[bin]]
name = "vtr2vcd"
path = "src/bin/vtr2vcd.rs"

[features]
default = ["vcd"]
# VCD input through wellen, for the `vtr` command; the viewer does without it.
vcd = ["dep:wellen"]

[dependencies]
vtr = { path = "../../core/vtr" }
fst-reader = "0.17"
wellen = { version = "0.25", optional = true }
flate2 = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
serde_json = "1"
memmap2 = "0.9"
crc32fast = "1.4"

[dev-dependencies]
tempfile = "3"
fst-writer = "0.3"
rand = "0.8"
