[package]
name = "vtr-query"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.85"
description = "Bounded raw trace queries shared by native and VS Code Volna sessions."

[features]
default = []
wire = ["dep:prost", "dep:prost-build"]
native-engine = ["dep:vtr", "dep:rand"]

[dependencies]
thiserror = "2"
prost = { version = "0.14", optional = true }

[build-dependencies]
prost-build = { version = "0.14", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
vtr = { path = "../vtr", optional = true }
rand = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3"
