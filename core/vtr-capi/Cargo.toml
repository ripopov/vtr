[package]
name = "vtr-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Stable C ABI for the VTR trace library (libvtr)"

[lib]
name = "vtr"
crate-type = ["cdylib", "staticlib"]

[features]
# libvtr allocates from a heap of its own (src/heap.rs), so a crash that leaves the C
# library's heap locked cannot block the crash guard's rescue. Opt-in, with the guard:
# it costs 5 to 16% peak memory (docs/crash-safe-vtr.html, stage 5).
private-heap = ["dep:mimalloc"]

[dependencies]
vtr = { path = "../vtr" }
vtr-guard = { path = "../vtr-guard" }
# mimalloc without `override`, so the application's malloc is untouched.
mimalloc = { version = "0.1", default-features = false, optional = true }
libc = "0.2"

[dev-dependencies]
cc = "1"
serde_json = "1"
tempfile = "3"
