[package]
name = "vtr-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Stable C ABI for the VTR trace library (libvtr)"

[lib]
name = "vtr"
crate-type = ["cdylib", "staticlib"]

[dependencies]
vtr = { path = "../vtr" }
vtr-guard = { path = "../vtr-guard" }
# VTR's own heap (src/heap.rs): mimalloc without `override`, so the application's malloc is untouched.
mimalloc = { version = "0.1", default-features = false }
libc = "0.2"

[dev-dependencies]
cc = "1"
serde_json = "1"
tempfile = "3"
